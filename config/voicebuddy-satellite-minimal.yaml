# VoiceBuddy satellite — minimal example.
#
# Demonstrates the BARK swap in isolation: drop the stock voice_assistant: +
# api: blocks, plug in the voicebuddy_satellite component, route mic and
# microWakeWord callbacks at it. Real deployments will combine this with the
# rest of formatBCE's full example (LED ring effects, timers, alarm, mute
# switch, OTA, the AIC3104 codec block, etc.). Keep this file small so the
# protocol wiring stays readable.

substitutions:
  hub_host: "192.168.1.50"   # VoiceBuddy hub IP on your LAN
  hub_port: "9102"           # BARK port (PROTOCOLS.md §5)
  room_id: "kitchen"

esphome:
  name: voicebuddy-satellite
  friendly_name: VoiceBuddy Satellite

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

network:
  enable_ipv6: false

logger:
  level: INFO
  logs:
    voicebuddy: INFO
    micro_wake_word: INFO
    i2s_audio: WARN

# NOTE: there is intentionally no `api:` and no `voice_assistant:` block
# here. The voicebuddy_satellite component below replaces both.

external_components:
  - source:
      type: local
      path: ../esphome/components

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    scan: true
    frequency: 100kHz

psram:
  mode: octal
  speed: 80MHz

# Mic configured for what BARK expects on the wire: 16 kHz, 16-bit, mono.
# The XVF3800 DSP can deliver this directly; reconfigure i2s_input on the
# full example accordingly.
microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: left

# Speaker chain: a single resampling speaker that lets the hub send 16 kHz
# mono PCM-16 while the I2S DAC runs at its native rate.
speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO44
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never
  - platform: resampler
    id: tts_speaker
    output_speaker: i2s_audio_speaker
    sample_rate: 16000
    bits_per_sample: 16

i2s_audio:
  - id: i2s_input
    i2s_lrclk_pin: GPIO46
    i2s_bclk_pin: GPIO9
  - id: i2s_output
    i2s_lrclk_pin: GPIO13
    i2s_bclk_pin: GPIO12

micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 1
  stop_after_detection: false
  models:
    - model: hey_jarvis
      id: hey_jarvis
  on_wake_word_detected:
    - voicebuddy_satellite.wake:
        wake_id: 1
        confidence: 255

voicebuddy_satellite:
  id: vb
  hub_host: ${hub_host}
  hub_port: ${hub_port}
  room_id: ${room_id}
  microphone: i2s_mics
  speaker: tts_speaker
  on_connected:
    - logger.log: "BARK session opened"
  on_disconnected:
    - logger.log: "BARK session closed"
