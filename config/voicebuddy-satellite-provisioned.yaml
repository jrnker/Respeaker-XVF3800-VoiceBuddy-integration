# VoiceBuddy satellite — runtime-provisioned example.
#
# Same hardware wiring as voicebuddy-satellite-minimal.yaml; the only
# difference is *where the configuration comes from*. The minimal config
# bakes WiFi credentials, hub host/port and room ID into the firmware via
# !secret + ${substitutions}. That works fine for one developer flashing
# their own device, but is unworkable as soon as the same image needs to
# ship to a Bedroom satellite, a Living Room satellite, a guest install,
# etc. — each one would otherwise require a fresh recompile + flash.
#
# This config replaces all four with NVS-backed runtime values:
#
#   - WiFi SSID + password    → ESPHome's built-in `wifi:` provisioning
#                                (captive portal AP + Improv BLE)
#   - Hub host + port         → `text:` and `number:` config entities
#                                with `restore_value: true` (NVS)
#   - Room ID                 → `text:` config entity, ditto
#   - Satellite ID (optional) → `text:` config entity; if blank, the
#                                C++ component falls back to a stable
#                                MAC-derived default.
#
# First-boot UX: device powers up, finds nothing in NVS, falls into the
# captive-portal AP `voicebuddy-XXXXXX` (last 6 hex of MAC). User joins
# that AP from a phone, the captive page auto-pops, they fill SSID +
# password + hub host/port + room ID + (optional) satellite ID, hit
# Save. ESPHome writes everything to NVS, the device reboots, joins the
# real WiFi, opens a BARK session to the configured hub.
#
# Re-provisioning UX: long-press BUT_A for ≥10 s. The XVF3800 mute
# switch lights up on press and we time the held duration in firmware;
# at 10 s the persisted entities are wiped, the live component config is
# cleared, and the device reboots back into the captive portal. Short
# presses keep their existing semantics (a quick mute toggle / wake) so
# this doesn't collide with the v0.1.1 PTT behaviour.

esphome:
  name: voicebuddy-satellite
  friendly_name: VoiceBuddy Satellite
  on_boot:
    # priority: 600 = before WiFi connects (default WiFi priority is
    # 250). We push the persisted hub/room into the component before it
    # tries to TCP-connect, so the very first try_connect_ already has
    # the right target. set_config_runtime is idempotent on re-runs.
    - priority: 600
      then:
        - voicebuddy_satellite.set_config:
            id: vb
            hub_host: !lambda 'return id(provisioned_hub_host).state;'
            hub_port: !lambda 'return (uint16_t) id(provisioned_hub_port).state;'
            room_id: !lambda 'return id(provisioned_room_id).state;'
            satellite_id: !lambda 'return id(provisioned_satellite_id).state;'

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended
    components:
      - espressif/esp-nn==1.1.2
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

# WiFi provisioning. NO `ssid:` / `password:` baked in — that's the
# whole point. ESPHome treats a wifi: block without static credentials
# (and with no NVS entry yet) as "stay in AP mode and serve the portal".
# Once the user submits credentials via the captive portal, ESPHome
# stores them in NVS itself; subsequent boots come up directly on the
# real WiFi.
#
# `ap:` is the fallback the captive portal lives on. SSID is a fixed
# string — `wifi.ap.ssid` is not templatable in ESPHome's schema, so
# we can't append a MAC suffix from a lambda. If we ever provision
# multiple satellites side by side and need distinct setup APs, the
# canonical workaround is `esphome.name_add_mac_suffix: true` +
# omitting `ap.ssid` (auto-derives from the now-MAC-suffixed device
# name). Skipped for now because flashing happens one device at a
# time. No password — onboarding is a 30-second LAN-side operation
# and a hidden password just creates a friction barrier.
wifi:
  ap:
    ssid: "VoiceBuddy Setup"
  power_save_mode: none
  reboot_timeout: 0s   # we manage reconnect inside voicebuddy_satellite

network:
  enable_ipv6: false

# Captive portal: opening any URL while connected to the AP redirects
# to the ESPHome built-in onboarding page. That page itself includes
# WiFi setup; the hub/room fields are surfaced on the same web_server
# as ESPHome entities (text + number) and reachable from the same AP.
captive_portal:

# web_server exposes the text/number entities so the captive portal
# page (or the user's phone browser at http://192.168.4.1/) can edit
# them. Version 3 is the current default; using v3 explicitly so a
# future ESPHome bump doesn't silently flip the URL scheme.
web_server:
  version: 3
  port: 80
  # Sort entities so the four provisioning fields cluster at the top,
  # then the audio/wake tuning knobs, then everything else.
  sorting_groups:
    - id: provisioning_group
      name: "Provisioning"
      sorting_weight: -100
    - id: tuning_group
      name: "Audio & wake tuning"
      sorting_weight: -50

# NOTE: esp32_improv (BLE-based onboarding) was tried here as a
# "no-cost fallback" but it isn't free — the BLE stack costs ~80 KB
# of always-on internal SRAM, which on top of mWW + WiFi + speaker
# chain leaves no headroom: rx_buf_ realloc OOM'd the moment a TTS
# reply started streaming after the wake. Captive portal alone is
# the supported onboarding path. Improv-over-BLE was also flagged
# because `authorizer: none` lets anyone in BLE range re-provision.

logger:
  level: INFO
  logs:
    voicebuddy: INFO
    i2s_audio: WARN

external_components:
  - source:
      type: local
      path: ../esphome/components
  # Patched i2s_audio — see voicebuddy-satellite-minimal.yaml for the
  # rationale; this fork adds per-source resample so the XVF3800's
  # native 48 kHz / 32-bit / stereo stream is legal mWW input.
  - source:
      type: git
      url: https://github.com/formatBCE/esphome
      ref: respeaker_microphone
    components:
      - i2s_audio
    refresh: 0s
  - source:
      type: git
      url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
      ref: main
    components:
      - respeaker_xvf3800
      - aic3104
    refresh: 0s

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    scan: true
    frequency: 100kHz

psram:
  mode: octal
  speed: 80MHz

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO44
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: aic3104_dac

  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: tts_mixing_input
        timeout: never
      - id: spare_mixing_input
        timeout: never

  - platform: resampler
    id: tts_speaker
    output_speaker: tts_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

audio_dac:
  - platform: aic3104
    id: aic3104_dac
    i2c_id: internal_i2c

# --- Provisioning-backed config entities -----------------------------
#
# All four entities have `restore_value: true` and `optimistic: true`,
# which means ESPHome stores their last value in NVS and replays it on
# boot. That replay is what makes the on_boot lambda above see the
# user's previous answer instead of the empty initial_value.
#
# The web UI exposes them under the "Provisioning" group; the captive
# portal page links to them directly. Setting any of them at runtime
# triggers the on_value handler, which re-pushes config into the
# voicebuddy_satellite component and reconnects to the new hub if the
# host or room changed.

text:
  - platform: template
    id: provisioned_hub_host
    name: "Hub host (IP or DNS)"
    icon: mdi:server-network
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    mode: text
    web_server:
      sorting_group_id: provisioning_group
      sorting_weight: 1
    on_value:
      - voicebuddy_satellite.set_config:
          id: vb
          hub_host: !lambda 'return x;'
          hub_port: !lambda 'return (uint16_t) id(provisioned_hub_port).state;'
          room_id: !lambda 'return id(provisioned_room_id).state;'
          satellite_id: !lambda 'return id(provisioned_satellite_id).state;'

  - platform: template
    id: provisioned_room_id
    name: "Room ID"
    icon: mdi:home-map-marker
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 16
    mode: text
    web_server:
      sorting_group_id: provisioning_group
      sorting_weight: 3
    on_value:
      - voicebuddy_satellite.set_config:
          id: vb
          hub_host: !lambda 'return id(provisioned_hub_host).state;'
          hub_port: !lambda 'return (uint16_t) id(provisioned_hub_port).state;'
          room_id: !lambda 'return x;'
          satellite_id: !lambda 'return id(provisioned_satellite_id).state;'

  - platform: template
    id: provisioned_satellite_id
    name: "Satellite ID (optional override)"
    icon: mdi:tag
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 16
    mode: text
    web_server:
      sorting_group_id: provisioning_group
      sorting_weight: 4
    on_value:
      - voicebuddy_satellite.set_config:
          id: vb
          hub_host: !lambda 'return id(provisioned_hub_host).state;'
          hub_port: !lambda 'return (uint16_t) id(provisioned_hub_port).state;'
          room_id: !lambda 'return id(provisioned_room_id).state;'
          satellite_id: !lambda 'return x;'

number:
  - platform: template
    id: provisioned_hub_port
    name: "Hub port"
    icon: mdi:numeric
    optimistic: true
    restore_value: true
    initial_value: 9102
    min_value: 1
    max_value: 65535
    step: 1
    mode: box
    web_server:
      sorting_group_id: provisioning_group
      sorting_weight: 2
    on_value:
      - voicebuddy_satellite.set_config:
          id: vb
          hub_host: !lambda 'return id(provisioned_hub_host).state;'
          hub_port: !lambda 'return (uint16_t) x;'
          room_id: !lambda 'return id(provisioned_room_id).state;'
          satellite_id: !lambda 'return id(provisioned_satellite_id).state;'

# --- Audio & wake tuning entities ------------------------------------
#
# Three runtime knobs we expose for in-field tuning of the wake-word
# pipeline plus a couple of read-only diagnostics. See docs/AUDIO-PIPELINE.md
# for the full audit of what the DSP is doing and what's still off-limits
# until the upstream respeaker_xvf3800 component grows more schema.
#
# Wake-word sensitivity: presets re-quantise mWW's per-model probability
# cutoff. Pattern lifted from formatBCE's reference YAML — same FAPH
# numbers (False Accepts Per Hour on the Dinner Party Corpus) annotate
# the cutoffs. We only ship the okay_nabu cutoff because that's the only
# model loaded in this config; if more models get added later the lambda
# needs corresponding lines per kahrendt's published numbers.

select:
  - platform: template
    name: "Wake-word sensitivity"
    id: wake_word_sensitivity
    icon: mdi:tune-variant
    optimistic: true
    restore_value: true
    entity_category: config
    initial_option: "Slightly sensitive"
    options:
      - "Slightly sensitive"
      - "Moderately sensitive"
      - "Very sensitive"
    web_server:
      sorting_group_id: tuning_group
      sorting_weight: 1
    on_value:
      - lambda: |-
          // Quantised uint8 probability cutoffs for okay_nabu@20241226.3.
          // Values from the kahrendt/microWakeWord manifest + the FAPH
          // numbers measured on the Dinner Party Corpus.
          if (x == "Slightly sensitive") {
            id(okay_nabu).set_probability_cutoff(217);   // 0.85 -> 0.000 FAPH (manifest default)
          } else if (x == "Moderately sensitive") {
            id(okay_nabu).set_probability_cutoff(176);   // 0.69 -> 0.376 FAPH
          } else if (x == "Very sensitive") {
            id(okay_nabu).set_probability_cutoff(143);   // 0.56 -> 0.751 FAPH
          }

# Voice-direction LED visualiser. Default OFF so we don't burn the
# on-board LED ring 24/7 — the feature is opt-in.
#
# Behaviour while enabled:
#   idle           → dark
#   wake fires     → ring lights blue with red LEDs frozen at the beam
#                    direction captured at that moment. Direction does
#                    NOT track the beam afterwards — it's a snapshot.
#   TTS starts     → dark (we're done listening, hub is replying)
#   disconnect     → dark (BARK session dropped)
#
# Implementation: the wake hooks call `paint_listening_leds` once,
# which snapshots the current beam and writes the ring. There is no
# repaint loop — the visual stays exactly as painted until the
# `on_tts_start` / `on_disconnected` hooks blank it.
switch:
  - platform: template
    name: "Voice direction LEDs"
    id: led_voice_direction_enabled
    icon: mdi:radar
    optimistic: true
    # switch.template persists via restore_mode (text/number/select use
    # restore_value). RESTORE_DEFAULT_OFF = restore the last-saved state,
    # fall back to OFF on a fresh device or after a factory reset.
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    web_server:
      sorting_group_id: tuning_group
      sorting_weight: 2
    turn_on_action:
      - lambda: 'id(led_voice_direction_enabled).publish_state(true);'
    turn_off_action:
      # When disabling, blank the ring once so the last frame doesn't
      # stay frozen on. The interval below stops repainting.
      - lambda: |-
          uint32_t blank[12] = {0};
          id(respeaker).set_led_ring(blank);
          id(led_voice_direction_enabled).publish_state(false);

sensor:
  # Voice/Noise Ratio surfaced as 0-100%. The DSP's own confidence that
  # what it's hearing is voice rather than noise — diagnostic for "is
  # the radio drowning the wake out from the DSP's perspective".
  - platform: template
    name: "Voice/Noise ratio"
    id: vnr_value
    icon: mdi:waveform
    update_interval: 1s
    accuracy_decimals: 0
    unit_of_measurement: "%"
    web_server:
      sorting_group_id: tuning_group
      sorting_weight: 3
    lambda: |-
      // read_vnr() returns 0..255 in voice-probability units.
      return (float) id(respeaker).read_vnr() * 100.0f / 255.0f;

  # User-visible mirror of the internal voice_beam_direction sensor.
  # Same value, just shows up in the web UI / HA without the noise of
  # 250ms updates blasting through the entity log.
  - platform: template
    name: "Voice direction (sector)"
    id: voice_beam_visible
    icon: mdi:compass
    update_interval: 1s
    accuracy_decimals: 0
    web_server:
      sorting_group_id: tuning_group
      sorting_weight: 4
    lambda: |-
      return (float) id(respeaker).read_led_beam_direction();

# --- Long-press factory-reset gesture --------------------------------
#
# BUT_A semantics on the XVF3800 board: pressing the physical button
# tells the DSP to mute its mic; we observe that as `mic_mute_switch`
# transitioning ON. Existing minimal-config behaviour: any press fires
# WAKE + auto-unmute (press-to-talk fallback while wake-word is being
# tuned).
#
# We add a SECOND interpretation here: hold the button for ≥10 s and
# the device factory-resets. The short-press path is unchanged.
# Implementation: when the switch goes ON, kick off a 10 s timer; if it
# stays ON for the full duration, reset. If it goes OFF before the
# timer fires we cancel.
#
# --- DISABLED 2026-04-28 ---------------------------------------------
# Mute button reverted to its plain hardware mute-toggle behaviour
# (upstream default). Both the press-to-talk WAKE shortcut and this
# long-press factory-reset gesture are disabled. Code kept commented
# below so it can be re-enabled by un-commenting:
#   1) the `globals:` / `interval:` / `do_factory_reset` script blocks
#      below, and
#   2) the `on_turn_on:` / `on_turn_off:` blocks under `mute_switch:`
#      further down.
# Factory reset is still reachable via the admin UI / API.

# globals:
#   - id: factory_reset_arm_ms
#     type: uint32_t
#     restore_value: no
#     initial_value: '0'

# interval:
#   - interval: 500ms
#     then:
#       - lambda: |-
#           // Poll the same mute switch the upstream config exposes. If the
#           // press is still held 10 s after it started, factory-reset.
#           static const uint32_t HOLD_MS = 10000;
#           uint32_t armed_at = id(factory_reset_arm_ms);
#           if (armed_at == 0) return;
#           if (!id(mic_mute_switch).state) {
#             // Released early — abort.
#             id(factory_reset_arm_ms) = 0;
#             return;
#           }
#           if (millis() - armed_at >= HOLD_MS) {
#             ESP_LOGW("voicebuddy", "long-press factory reset triggered");
#             id(factory_reset_arm_ms) = 0;
#             // Wipe the live config inside the running component, drop
#             // the BARK session, then defer the NVS wipe + reboot to
#             // the on_long_press script so logging gets a chance to
#             // flush.
#             id(vb).factory_reset_runtime();
#             id(do_factory_reset).execute();
#           }

script:
  # One-shot LED paint at wake. Snapshots the current beam direction
  # and writes the ring; the visual then stays frozen until the
  # tts_start / on_disconnected hooks blank it. No repaint loop, so
  # the user can shift mid-utterance without the red wedge chasing
  # them — the captured direction reflects where the wake phrase came
  # from, which is what the user wants to confirm.
  - id: paint_listening_leds
    then:
      - if:
          condition:
            switch.is_on: led_voice_direction_enabled
          then:
            - lambda: |-
                constexpr int NUM_LEDS = 12;
                // Width of the red wedge in LEDs *each side* of the
                // captured beam. 0 = single LED; 1 = three LEDs (centre
                // plus one neighbour each way).
                constexpr int RED_WIDTH = 1;
                // Beam 0 isn't aligned with LED 0 on this board layout
                // (formatBCE's reference effect also rotates by 5).
                constexpr int LED_OFFSET = 5;
                constexpr uint8_t BLUE_LEVEL = 50;   // dim, USB-shared power
                constexpr uint8_t RED_LEVEL  = 150;
                int target = -1;
                if (id(voice_beam_direction).has_state()) {
                  int beam = (int) id(voice_beam_direction).state;
                  target = (beam + LED_OFFSET) % NUM_LEDS;
                }
                uint32_t colors[NUM_LEDS];
                for (int i = 0; i < NUM_LEDS; i++) {
                  bool is_red = false;
                  if (target >= 0) {
                    int dist = i - target;
                    if (dist < 0) dist = -dist;
                    if (dist > NUM_LEDS / 2) dist = NUM_LEDS - dist;
                    is_red = (dist <= RED_WIDTH);
                  }
                  if (is_red) {
                    colors[i] = ((uint32_t) RED_LEVEL) << 16;  // R only
                  } else {
                    colors[i] = (uint32_t) BLUE_LEVEL;         // B only
                  }
                }
                id(respeaker).set_led_ring(colors);

  # --- DISABLED 2026-04-28: long-press factory-reset gesture ----------
  # See the DISABLED block higher up in this file. Re-enable in tandem
  # with the globals/interval blocks and the mute_switch on_turn_on/
  # on_turn_off handlers.
  #
  # - id: do_factory_reset
  #   then:
  #     # Wipe everything ESPHome persisted in NVS in one shot —
  #     # WiFi SSID/password AND every `restore_value: true` entity
  #     # (the four provisioning text/number entities). ESPHome
  #     # exposes the preferences singleton as `global_preferences`;
  #     # `.reset()` zeros the backing NVS partition so the next
  #     # boot looks like a factory-fresh device. There is no
  #     # `wifi.clear_credentials` automation action — this is the
  #     # canonical lambda equivalent.
  #     - lambda: |-
  #         ESP_LOGW("voicebuddy", "wiping NVS for factory reset");
  #         global_preferences->reset();
  #     - delay: 500ms
  #     - lambda: |-
  #         ESP_LOGW("voicebuddy", "rebooting into provisioning mode");
  #         App.safe_reboot();

respeaker_xvf3800:
  id: respeaker
  address: 0x2C
  mute_switch:
    id: mic_mute_switch
    name: "Microphone Mute"
    update_interval: 200ms
    # --- DISABLED 2026-04-28: press-to-talk + long-press factory-reset
    # The hardware mute button is back to its upstream default — pressing
    # toggles the DSP mic-mute state, nothing more. Re-enable in tandem
    # with the globals / interval / do_factory_reset blocks above.
    #
    # on_turn_on:
    #   # Arm the long-press timer for the factory-reset interval check
    #   # above. If the user lets go before 10 s elapse, the timer aborts.
    #   - lambda: 'id(factory_reset_arm_ms) = millis();'
    #   # Existing v0.1.1 short-press behaviour: un-mute and fire WAKE.
    #   # Runs immediately on press; if the long-press path also fires
    #   # later we'll reset the device anyway, so the brief WAKE is harmless.
    #   - switch.turn_off: mic_mute_switch
    #   - script.execute: paint_listening_leds
    #   - voicebuddy_satellite.wake:
    #       wake_id: 99
    #       confidence: 255
    # on_turn_off:
    #   - lambda: 'id(factory_reset_arm_ms) = 0;'
  # 0..11 sector index of the strongest voice beam (12 sectors × 30°).
  # `internal: true` keeps it out of the web_server entity list — it's a
  # diagnostic the LED interval below reads, plus the standalone
  # "Voice direction (sector)" template sensor mirrors it for users.
  led_beam_sensor:
    id: voice_beam_direction
    name: "Voice beam (raw index)"
    internal: true
    update_interval: 250ms
  firmware:
    url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration/raw/refs/heads/main/application_xvf3800_inthost-lr48-sqr-i2c-v1.0.7-release.bin
    version: "1.0.7"
    md5: 043a848f544ff2c7265ac19685daf5de

# Wake-word engine. Identical wiring to the minimal config; the
# provisioning flow doesn't change anything about how the mic stream is
# routed into mWW.
micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 1
  stop_after_detection: false
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
  vad:
    probability_cutoff: 0.05
  on_wake_word_detected:
    - logger.log:
        format: "wake word detected: %s"
        args: [ 'wake_word.c_str()' ]
    - script.execute: paint_listening_leds
    - voicebuddy_satellite.wake:
        wake_id: 1
        confidence: 230

# voicebuddy_satellite is configured with NO hub_host / hub_port /
# room_id / satellite_id at compile time — those land at boot via
# voicebuddy_satellite.set_config above. The microphone + speaker
# bindings are identical to the minimal config.
voicebuddy_satellite:
  id: vb
  microphone:
    microphone: i2s_mics
    channels: 0
  speaker: tts_speaker
  on_connected:
    - logger.log: "BARK session opened"
    - micro_wake_word.start:
  on_disconnected:
    - logger.log: "BARK session closed"
    - micro_wake_word.stop:
    # Blank the ring on session loss. Without this, if the satellite
    # loses BARK mid-utterance the listening LEDs stay frozen on
    # until the next wake.
    - lambda: |-
        if (id(led_voice_direction_enabled).state) {
          uint32_t blank[12] = {0};
          id(respeaker).set_led_ring(blank);
        }
  on_tts_start:
    # Hub is replying — listening is over. Blank the ring so it goes
    # dark while TTS plays. Lights up again on the next wake.
    - lambda: |-
        if (id(led_voice_direction_enabled).state) {
          uint32_t blank[12] = {0};
          id(respeaker).set_led_ring(blank);
        }
  on_tts_end:
    - voicebuddy_satellite.stop_listening:
