# VoiceBuddy satellite — minimal example.
#
# Demonstrates the BARK swap in isolation: drop the stock voice_assistant: +
# api: blocks, plug in the voicebuddy_satellite component, route mic at it.
# Real deployments will combine this with the rest of formatBCE's full
# example (LED ring effects, timers, alarm, mute switch, OTA, the full
# AIC3104 codec block, etc.). Keep this file small so the protocol wiring
# stays readable.
#
# Hardware contract is taken from formatBCE's upstream example
# (config/respeaker-xvf-satellite-example.yaml): the XVF3800 outputs 48 kHz /
# 32-bit / stereo over I2S — channel 0 is AEC-processed for ASR, channel 1 is
# unprocessed (originally fed to microWakeWord). The voicebuddy_satellite
# component decimates 3:1 in firmware to land on the 16 kHz wire format.
#
# **microWakeWord on satellite (v0.1.1).** The mic stays at 48 kHz / 32-bit /
# stereo (the XVF3800 hardware contract). Channel 0 is AEC-processed audio,
# routed to the BARK uplink for ASR. Channel 1 is unprocessed audio, fed to
# micro_wake_word. Stock ESPHome's `i2s_audio` doesn't accept a non-16 kHz
# microphone source for `micro_wake_word`; formatBCE's `respeaker_microphone`
# branch patches in the per-source resample + channel-pick that makes 48 kHz
# input legal here. Wake word for v0.1 is the prebuilt `okay_nabu` model;
# custom "Hey Buddy" lands as a model-URL swap in v0.2 once trained.
#
# **BUT_A press-to-talk (transitional fallback).** On the Seeed ReSpeaker
# XVF3800 + XIAO ESP32S3 board, BUT_A is wired straight to the XVF3800 DSP —
# the ESP32 never sees the GPIO directly. We observe the press via the DSP's
# mute state polled over I2C: any mute-on transition fires WAKE + auto-unmute.
# Kept here while mWW is being tuned; once mWW is reliable this whole handler
# gets repurposed to a real mute toggle (press = mute, press again = unmute).

substitutions:
  hub_host: "192.168.1.50"   # VoiceBuddy hub IP on your LAN
  hub_port: "9102"           # BARK port (PROTOCOLS.md §5)
  room_id: "kitchen"

esphome:
  name: voicebuddy-satellite
  friendly_name: VoiceBuddy Satellite

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended
    components:
      # microWakeWord pulls in TFLite Micro and needs esp-nn for SIMD ops.
      - espressif/esp-nn==1.1.2
    sdkconfig_options:
      # Larger I/D caches → faster mWW inference on the ESP32-S3.
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      # Move read-only data + instruction prefetch to PSRAM so mWW runs while
      # flash is busy with audio chunks. Costs PSRAM, buys throughput.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

network:
  enable_ipv6: false

logger:
  level: INFO
  logs:
    voicebuddy: INFO
    i2s_audio: WARN

# NOTE: there is intentionally no `api:` and no `voice_assistant:` block
# here. The voicebuddy_satellite component below replaces both.

external_components:
  # Local copy of the voicebuddy_satellite component shipped in this fork.
  - source:
      type: local
      path: ../esphome/components
  # Patched i2s_audio: stock ESPHome rejects non-16 kHz microphone sources
  # for micro_wake_word; this fork adds per-source resample + channel-pick
  # so the XVF3800's native 48 kHz / 32-bit / stereo stream is legal input.
  # Must come BEFORE the respeaker_xvf3800 source so its `i2s_audio`
  # reference resolves to the patched component.
  - source:
      type: git
      url: https://github.com/formatBCE/esphome
      ref: respeaker_microphone
    components:
      - i2s_audio
    refresh: 0s
  # Upstream XVF3800 driver + AIC3104 DAC. Required: without the
  # respeaker_xvf3800 block the DSP never enters streaming mode and the I2S
  # input stays silent.
  - source:
      type: git
      url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
      ref: main
    components:
      - respeaker_xvf3800
      - aic3104
    refresh: 0s

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    scan: true
    frequency: 100kHz

psram:
  mode: octal
  speed: 80MHz

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

# Mic = native XVF3800 output: 48 kHz / 32-bit / stereo. The
# microphone_source schema inside voicebuddy_satellite (channels: 0) and
# micro_wake_word (channels: 1) each pick one channel from this stereo source.
microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  # Hardware speaker. The XVF3800 drives BCLK/LRCLK as I2S primary and the
  # AIC3104 DAC sits downstream, so we have to run at 48 kHz / 32-bit /
  # stereo regardless of what we feed the chain.
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO44
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: aic3104_dac

  # Mixer stage: takes 16-bit input from the resampler and produces the
  # 32-bit / stereo stream that i2s_audio_speaker expects. Without this
  # stage i2s_audio rejects the stream with "Audio stream settings are
  # not compatible with this I2S configuration". ESPHome requires the
  # mixer to have ≥2 sources; we only use tts_mixing_input, the second
  # is a no-op placeholder so the schema validates.
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: tts_mixing_input
        timeout: never
      - id: spare_mixing_input
        timeout: never

  # Resampler: hub streams 16 kHz / 16-bit / mono PCM; this lifts it to
  # 48 kHz / 16-bit so the mixer can finish the format conversion.
  - platform: resampler
    id: tts_speaker
    output_speaker: tts_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

audio_dac:
  - platform: aic3104
    id: aic3104_dac
    i2c_id: internal_i2c

respeaker_xvf3800:
  id: respeaker
  address: 0x2C
  mute_switch:
    id: mic_mute_switch
    name: "Microphone Mute"
    # 200 ms feels snappy enough for press-to-talk while keeping the I2C
    # bus traffic light. Drop to 100 ms if the press latency feels too
    # slow on your install.
    update_interval: 200ms
    on_turn_on:
      # User pressed BUT_A. The DSP just muted itself — un-mute it over
      # I2C so the user's voice reaches the ASR, then fire WAKE.
      - switch.turn_off: mic_mute_switch
      - voicebuddy_satellite.wake:
          wake_id: 99
          confidence: 255
  firmware:
    url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration/raw/refs/heads/main/application_xvf3800_inthost-lr48-sqr-i2c-v1.0.7-release.bin
    version: "1.0.7"
    md5: 043a848f544ff2c7265ac19685daf5de

# Wake-word engine. Channel 1 of i2s_mics is the unprocessed (no AEC) feed,
# which mWW prefers — AEC can chew up the wake phrase. The patched i2s_audio
# component above makes the 48 kHz source legal here.
#
# Model: prebuilt `okay_nabu` from kahrendt's microWakeWord releases. It's
# the same model HA Voice PE ships and is well-validated on this exact
# board. v0.2 swap: train "Hey Buddy" via the kahrendt/microWakeWord Colab,
# host the resulting .json + .tflite, point `model:` at the new URL.
micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 1
    # gain_factor: 4   # uncomment if channel 1 is too quiet for reliable detection
  stop_after_detection: false
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
  vad:
    probability_cutoff: 0.05
  on_wake_word_detected:
    - logger.log:
        format: "wake word detected: %s"
        args: [ 'wake_word.c_str()' ]
    - voicebuddy_satellite.wake:
        wake_id: 1
        confidence: 230

voicebuddy_satellite:
  id: vb
  hub_host: ${hub_host}
  hub_port: ${hub_port}
  room_id: ${room_id}
  microphone:
    microphone: i2s_mics
    channels: 0
  speaker: tts_speaker
  on_connected:
    - logger.log: "BARK session opened"
    # Start mWW only after the BARK session is up — otherwise a wake during
    # boot fires WAKE into a closed socket and the frame is dropped.
    - micro_wake_word.start:
  on_disconnected:
    - logger.log: "BARK session closed"
    - micro_wake_word.stop:
  on_tts_end:
    - voicebuddy_satellite.stop_listening:
